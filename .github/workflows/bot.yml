name: Analyses foot quotidiennes

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Lancer le robot
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python bot_auto.py

      - name: Envoyer sur Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python envoi_telegram.py

      - name: Enregistrer les pronostics
        run: |
          git config user.name "robot"
          git config user.email "robot@users.noreply.github.com"
          git add pronos.md
          git commit -m "Pronostics du jour" || echo "Rien à enregistrer"
          git push
